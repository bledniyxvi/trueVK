[package]
name = "vkmusic"
version = "0.4.0"
edition = "2024"

[[bin]]
name = "truevk"
path = "src/main.rs"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
global-hotkey = { version = "0.10.0", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
