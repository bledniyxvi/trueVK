[package]
name = "vkmusic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
